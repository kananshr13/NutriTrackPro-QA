name: QA Automation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  qa-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run QA tests
        env:
          QA_USERNAME: ${{ secrets.QA_USERNAME }}
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
        run: |
          mkdir -p reports
          pytest automation/api -v --junitxml=reports/test-results.xml

      - name: Generate QA dashboard report
        if: always()
        run: |
          python scripts/generate_report.py

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-dashboard-report
          path: |
            reports/test-results.xml
            dashboard/data/test-results.json

      - name: Deploy dashboard to Vercel
        if: success()
        run: |
          npm install --global vercel
          vercel deploy dashboard --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
